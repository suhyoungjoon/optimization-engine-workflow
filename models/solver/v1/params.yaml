# solver 엔진 params (모델 레지스트리 버전). v1은 규칙 엔진 v1의 섹션(검증·지표가 쓰는 작업소요·이동·매칭)에 objective를 더했다.
# 버전 파일은 만든 뒤 바꾸지 않는다. 새 버전은 승인(python -m workflow approve)이 부모 버전을 복사해 만든다.
# 개선 루프(improvement)는 각 섹션의 bounds 안에서만 값을 바꿀 수 있다.
# bounds 형식: {키: [min, max]}. 값이 리스트·딕셔너리면 모든 원소에 같은 범위를 적용한다.
# docs 형식: {키: 설명}. 화면과 개선 agent에 그대로 보인다. bounds·docs는 개선안으로 바꿀 수 없다.
# 변경이 승인되면 version을 올리고 git 커밋으로 남긴다.

version: 1

matching:                       # 시간·지역 3단계 매칭. 인덱스 0/1/2 = 1/2/3단계, 단계가 올라갈수록 완화
  time_window_min: [0, 30, 60]  # 고객 희망시간 대비 허용 오차(분)
  area_extension_km: [0, 1, 3]  # 관할 구역 경계 밖으로 허용하는 거리(km)
  docs:
    time_window_min: 고객 희망시각 대비 허용 오차(분). 1·2·3단계 순서이며 단계가 올라갈수록 넓어진다
    area_extension_km: 작업자가 소속 관할 구역 밖으로 나가 배정받을 수 있는 거리(km). 1·2·3단계 순서
  bounds: {time_window_min: [0, 120], area_extension_km: [0, 5]}

duration:                       # 작업소요 = 작업유형 기본 소요 × 난이도 가중치 × 건물유형 가중치
  base_min: {install: 60, repair: 45}
  docs:
    base_min: 작업유형별 기본 소요(분). install=개통, repair=장애
  bounds: {base_min: [15, 180]}

weights:
  difficulty: {none: 1.0, pole: 1.5, outdoor: 1.2, high_risk: 1.8}
  building: {house: 1.0, apartment: 1.1}
  docs:
    difficulty: 난이도별 작업소요 가중치. none=일반, pole=승주, outdoor=옥외, high_risk=고위험
    building: 건물유형별 작업소요 가중치. house=주택, apartment=아파트
  bounds: {difficulty: [1.0, 3.0], building: [0.5, 2.0]}

travel:                         # 이동시간 = 직선거리 × 우회계수 / 평균 속도
  avg_speed_kmh: 30
  detour_factor: 1.3            # 도로 우회 근사. 고정값 (개선 대상 아님: bounds 폭 0)
  docs:
    avg_speed_kmh: 이동 평균 속도(km/h)
    detour_factor: 직선거리 대비 도로 거리 비율. 고정값이라 개선 대상이 아니다
  bounds: {avg_speed_kmh: [10, 60], detour_factor: [1.3, 1.3]}

cei:
  master_threshold: 80          # 이 값 이상이면 명장
  docs:
    master_threshold: CEI 점수가 이 값 이상이면 명장. 후보 중 명장을 먼저 고른다
  bounds: {master_threshold: [0, 100]}

approval_required:              # L4 가드레일: 아래 중 하나라도 해당하면 pending_approval
  matching_stage_gte: 3         # 이 단계 이상 완화 매칭으로 배정
  non_master: true              # 명장 후보가 있는데 명장이 아닌 작업자에게 배정
  docs:
    matching_stage_gte: 이 단계 이상의 완화 매칭으로 배정하면 승인 대기 (L4 이상)
    non_master: 켜져 있으면, 명장 후보가 있는데 일반 작업자에게 배정할 때 승인 대기 (L4 이상)
  bounds: {matching_stage_gte: [1, 3]}

overrides:                      # 구간 조건: when의 차원 값에 해당하는 지시서에만 set을 적용
  allowed_sections: [matching, cei, approval_required]   # 검증(작업소요·이동시간)에 쓰는 섹션은 제외
  rules: []                     # 예: {when: {branch: B, hour: ["09", "10"]}, set: {"matching.area_extension_km[2]": 4}}

objective:                      # solver 목적함수 (가중합, 최대화). 정수 점수
  assign: 1000                  # 지시서 1건 배정 점수
  time_diff_per_min: 5          # 희망시각과의 차이 1분당 감점
  home_km: 20                   # 작업자 거점과 지시서 사이 거리 1km당 감점 (순서에 따라 달라지는 이동시간의 근사)
  master: 30                    # 명장(CEI 기준 이상) 배정 가점
  time_limit: 0.2               # 날짜·지점 문제 하나의 결정적 시간 한도 (CP-SAT deterministic time, 실제 초가 아님)
  docs:
    assign: 지시서 1건을 배정할 때의 점수. 다른 항목보다 크면 배정 수를 먼저 늘린다
    time_diff_per_min: 희망시각과 시작 시각 차이 1분당 감점. 키우면 배정 수보다 희망시간 일치를 더 지킨다
    home_km: 작업자 거점과 지시서 거리 1km당 감점. 이동시간을 직접 넣기 어려워 거리로 근사한다
    master: 명장에게 배정할 때의 가점
    time_limit: 문제 하나에 쓰는 결정적 시간 한도. 키우면 해가 좋아질 수 있지만 검증 시간이 늘어난다
  bounds: {assign: [100, 10000], time_diff_per_min: [0, 100], home_km: [0, 200], master: [0, 500], time_limit: [0.01, 5]}
