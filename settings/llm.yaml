# LLM 설정 (코어 configs/llm.yaml의 사본). 코어 load_config(path)에 이 파일 경로를 넘긴다.
model: claude-sonnet-5
effort: medium                 # low | medium | high | xhigh | max
max_tokens: 16000
max_llm_calls_per_item: 12     # 코어 하네스(L0~L5)용. 이 레포에서는 쓰지 않는다 (호출 상한은 workflow.yaml)
concurrency: 4                 # 코어 하네스용. 이 레포에서는 쓰지 않는다
cache: true                    # 입력 해시 캐시. 최종 측정 때는 끈다 (환경변수 LLM_CACHE=0이 우선)

# 비용 계산용 단가 (USD / 100만 토큰, Anthropic 1st-party 기준, 2026-06 확인)
pricing_per_mtok:
  claude-sonnet-5: {input: 2.0, output: 10.0}
  claude-opus-5: {input: 5.0, output: 25.0}
  claude-opus-5-5: {input: 4.0, output: 20.0}
  claude-haiku-4-5: {input: 1.0, output: 5.0}
# 프롬프트 캐시 단가 배율 (입력 단가 대비): 쓰기 5분 TTL, 읽기
cache_multipliers: {write: 1.25, read: 0.1}
